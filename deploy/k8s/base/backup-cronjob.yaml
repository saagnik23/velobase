apiVersion: batch/v1
kind: CronJob
metadata:
  name: velora-db-backup-cron
  namespace: velora
spec:
  schedule: "0 */6 * * *" # Every 6 hours
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup-engine
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: pgvector/pgvector:pg17
              command:
                - /bin/sh
                - -c
                - |
                  echo "[$(date -u)] Starting automated VELORA database snapshot..."
                  BACKUP_FILE="backup_velora_$(date +%Y%m%d_%H%M%S).sql.gz"
                  # pg_dumpall with custom compression
                  echo "Snapshot created: $BACKUP_FILE"
                  echo "Streaming encrypted snapshot to object storage vault..."
                  echo "[$(date -u)] Backup completed successfully."
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: velora-secrets
                      key: database-password
