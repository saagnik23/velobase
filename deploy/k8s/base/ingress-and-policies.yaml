apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velora-ingress
  namespace: velora
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "velora-realtime"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.velora.internal
        - api.velora.internal
      secretName: velora-tls-cert
  rules:
    - host: app.velora.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: velora-web
                port:
                  number: 80
    - host: api.velora.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: velora-api
                port:
                  number: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velora-default-deny-all
  namespace: velora
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velora-allow-ingress-to-web
  namespace: velora
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: velora-web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
