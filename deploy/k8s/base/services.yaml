apiVersion: v1
kind: Service
metadata:
  name: velora-web
  namespace: velora
  labels:
    app.kubernetes.io/name: velora-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: velora-web
---
apiVersion: v1
kind: Service
metadata:
  name: velora-api
  namespace: velora
  labels:
    app.kubernetes.io/name: velora-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4000
      targetPort: http
  selector:
    app.kubernetes.io/name: velora-api
