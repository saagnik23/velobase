name: Docker & Kubernetes Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker-build-and-push:
    name: Build & Push Container Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}

      - name: Build and Push API Gateway Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating Kubernetes base & environment overlays..."
          kubectl kustomize deploy/k8s/overlays/development
          kubectl kustomize deploy/k8s/overlays/staging
          kubectl kustomize deploy/k8s/overlays/production
          echo "All Kustomize overlays validated successfully!"
