name: Docker & Kubernetes Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker-build:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Application Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.web
          push: false # Set to true when deploying with active package write tokens
          tags: ghcr.io/${{ github.repository }}-web:latest

      - name: Validate Kubernetes Manifests with Kubeval / Kustomize
        run: |
          mkdir -p build-out
          echo "Validating kustomize manifests..."
